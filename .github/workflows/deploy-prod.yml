name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.gcp \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/chat-agent-queue:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/chat-agent-queue:latest \
            .

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/chat-agent-queue:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/chat-agent-queue:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy chat-agent-queue \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/chat-agent-queue:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 4Gi \
            --cpu 2 \
            --max-instances 10 \
            --timeout 3600 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars "ENVIRONMENT=production,SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},UNIPILE_API_DNS=${{ secrets.UNIPILE_API_DNS }},UNIPILE_API_KEY=${{ secrets.UNIPILE_API_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},OPENAI_MODEL=${{ secrets.OPENAI_MODEL }},DEFAULT_MIN_DELAY_MINUTES=${{ secrets.DEFAULT_MIN_DELAY_MINUTES }},DEFAULT_MAX_DELAY_MINUTES=${{ secrets.DEFAULT_MAX_DELAY_MINUTES }},MAX_RETRY_ATTEMPTS=${{ secrets.MAX_RETRY_ATTEMPTS }},LOG_LEVEL=${{ secrets.LOG_LEVEL }}"
