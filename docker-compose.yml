services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chat_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_agent_queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatqueue2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_agent_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_agent_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: "Chat Agent Queue System"
      APP_VERSION: "1.0.0"
      DEBUG: "True"
      LOG_LEVEL: "INFO"
      
      # PostgreSQL (Internal - connects to postgres service)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chat_agent_queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatqueue2024}
      
      # Supabase (External - from .env)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      
      # Unipile API (from .env)
      UNIPILE_API_DNS: ${UNIPILE_API_DNS}
      UNIPILE_API_KEY: ${UNIPILE_API_KEY}
      
      # OpenAI API (from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      
      # Scheduling
      DEFAULT_MIN_DELAY_MINUTES: ${DEFAULT_MIN_DELAY_MINUTES:-0}
      DEFAULT_MAX_DELAY_MINUTES: ${DEFAULT_MAX_DELAY_MINUTES:-0}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
    
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - chat_agent_network
    
    volumes:
      - ./app:/app/app:ro  # Mount app code as read-only for development

volumes:
  postgres_data:
    driver: local

networks:
  chat_agent_network:
    driver: bridge
