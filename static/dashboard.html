<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Agent Queue Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .account-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .account-item:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .account-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .account-id {
            font-family: monospace;
            font-size: 0.9rem;
            color: #666;
            background: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .message-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .message-item.scheduled {
            border-left-color: #ffc107;
        }

        .message-item.sent {
            border-left-color: #28a745;
        }

        .message-item.error {
            border-left-color: #dc3545;
        }

        .error-detail {
            margin-top: 8px;
            padding: 10px 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .error-detail code {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 6px;
            background: #fee2e2;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .message-item.cancelled {
            border-left-color: #6c757d;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .message-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-scheduled {
            background: #fff3cd;
            color: #856404;
        }

        .status-sent {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-cancelled {
            background: #d6d8db;
            color: #383d41;
        }

        .message-content {
            color: #333;
            margin-bottom: 8px;
        }

        .message-meta {
            font-size: 0.9rem;
            color: #666;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .last-updated {
            text-align: center;
            color: white;
            opacity: 0.8;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Chat Agent Queue Dashboard</h1>
            <p>Monitor your LinkedIn messaging system in real-time</p>
        </div>

        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh Data</button>

        <div id="error-container"></div>

        <div class="dashboard">
            <!-- Accounts Section -->
            <div class="card">
                <h2>👥 Connected Accounts</h2>
                <div id="accounts-container" class="loading">
                    Loading accounts...
                </div>
            </div>

            <!-- Queue Statistics -->
            <div class="card">
                <h2>📊 Queue Statistics</h2>
                <div id="stats-container" class="loading">
                    Loading statistics...
                </div>
            </div>
        </div>

        <!-- Messages Section -->
        <div class="card">
            <h2>📝 Message Queue</h2>
            <div id="messages-container" class="loading">
                Loading messages...
            </div>
        </div>

        <!-- Conversations Section -->
        <div class="card">
            <h2>💬 Conversations (with AI Status)</h2>
            <div id="conversations-container" class="loading">
                Loading conversations...
            </div>
        </div>

        <div class="last-updated" id="last-updated">
            Last updated: Never
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        async function fetchData() {
            try {
                // Fetch all data in parallel
                const [accountsRes, statsRes, messagesRes, conversationsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/v1/internal/accounts`),
                    fetch(`${API_BASE}/api/v1/internal/status/queues`),
                    fetch(`${API_BASE}/api/v1/internal/messages/all`),
                    fetch(`${API_BASE}/api/v1/internal/conversations`)
                ]);

                const accounts = await accountsRes.json();
                const stats = await statsRes.json();
                const messages = await messagesRes.json();
                const conversations = await conversationsRes.json();

                // Update UI
                updateAccounts(accounts);
                updateStats(stats);
                updateMessages(messages);
                updateConversations(conversations);
                
                // Update last updated time
                document.getElementById('last-updated').textContent = 
                    `Last updated: ${new Date().toLocaleTimeString()}`;
                
                // Clear any previous errors
                document.getElementById('error-container').innerHTML = '';
                
            } catch (error) {
                console.error('Error fetching data:', error);
                showError('Failed to fetch data: ' + error.message);
            }
        }

        function updateAccounts(data) {
            const container = document.getElementById('accounts-container');
            
            if (data.status === 'success' && data.accounts.length > 0) {
                container.innerHTML = data.accounts.map(account => `
                    <div class="account-item">
                        <div class="account-name">${account.name || 'Unnamed Account'}</div>
                        <div class="account-id">${account.account_id}</div>
                        <div style="margin-top: 8px; font-size: 0.9rem; color: #666;">
                            LinkedIn ID: ${account.provider_id}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<div class="loading">No accounts found</div>';
            }
        }

        function updateStats(data) {
            const container = document.getElementById('stats-container');
            
            if (data.status === 'success' && data.statistics) {
                const stats = data.statistics;
                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${stats.total_messages || 0}</div>
                            <div class="stat-label">Total Messages</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.scheduled || 0}</div>
                            <div class="stat-label">Scheduled</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.sent || 0}</div>
                            <div class="stat-label">Sent</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.error || 0}</div>
                            <div class="stat-label">Errors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.total_conversations || 0}</div>
                            <div class="stat-label">Conversations</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.total_jobs || 0}</div>
                            <div class="stat-label">Jobs</div>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = '<div class="loading">Failed to load statistics</div>';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessageError(message) {
            if (!message.error_message && !message.error) return '';
            const err = message.error;
            if (err && (err.title || err.detail || err.type)) {
                return `
                    <div class="error-detail">
                        ${err.title ? `<strong>${escapeHtml(err.title)}</strong><br>` : ''}
                        ${escapeHtml(err.detail || message.error_message || '')}
                        ${err.type ? `<br><code>${escapeHtml(err.type)}</code>` : ''}
                        ${err.status ? `<br><span style="opacity:0.85">HTTP ${err.status}</span>` : ''}
                    </div>`;
            }
            return `<div class="error-detail">${escapeHtml(message.error_message)}</div>`;
        }

        function updateMessages(data) {
            const container = document.getElementById('messages-container');
            
            if (data.status === 'success' && data.messages.length > 0) {
                container.innerHTML = data.messages.map(message => `
                    <div class="message-item ${message.status}">
                        <div class="message-header">
                            <div class="message-status status-${message.status}">${message.status}</div>
                            <div style="font-size: 0.9rem; color: #666;">
                                ${message.created_at ? new Date(message.created_at).toLocaleString() : 'Unknown time'}
                            </div>
                        </div>
                        <div class="message-content">${escapeHtml(message.message || 'No message content')}</div>
                        <div class="message-meta">
                            <strong>Chat ID:</strong> ${message.chat_id}<br>
                            <strong>Direction:</strong> ${message.direction}<br>
                            ${message.scheduled_at ? `<strong>Scheduled:</strong> ${new Date(message.scheduled_at).toLocaleString()}<br>` : ''}
                            ${formatMessageError(message)}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<div class="loading">No messages found</div>';
            }
        }

        function updateConversations(data) {
            const container = document.getElementById('conversations-container');
            
            if (data.status === 'success' && data.conversations && data.conversations.length > 0) {
                container.innerHTML = data.conversations.map(conv => {
                    // Determine AI status
                    const jobAI = conv.job_ai_enabled !== null ? conv.job_ai_enabled : 'Not Set';
                    const convAI = conv.conversation_ai_enabled;
                    
                    // Final AI status (job overrides conversation)
                    let finalAI = 'Enabled';
                    if (jobAI === false) {
                        finalAI = 'Disabled (Job)';
                    } else if (!convAI) {
                        finalAI = 'Disabled (Conversation)';
                    }
                    
                    // Status badge style
                    let aiBadgeClass = 'status-sent';
                    let aiIcon = '✅';
                    if (finalAI.includes('Disabled')) {
                        aiBadgeClass = 'status-error';
                        aiIcon = '❌';
                    }
                    
                    return `
                        <div class="message-item">
                            <div class="message-header">
                                <div>
                                    <strong>Chat ID:</strong> ${conv.chat_id.substring(0, 8)}...<br>
                                    <strong>Job ID:</strong> ${conv.job_id.substring(0, 8)}...
                                </div>
                                <div class="message-status ${aiBadgeClass}">
                                    ${aiIcon} AI: ${finalAI}
                                </div>
                            </div>
                            <div class="message-meta">
                                <strong>Stage:</strong> ${conv.stage || 'N/A'}<br>
                                <strong>Messages:</strong> ${conv.message_count || 0}<br>
                                <strong>Job AI:</strong> ${jobAI !== null ? (jobAI ? '✅ Enabled' : '❌ Disabled') : 'Not Set'}<br>
                                <strong>Conv AI:</strong> ${convAI ? '✅ Enabled' : '❌ Disabled'}<br>
                                <strong>Created:</strong> ${new Date(conv.created_at).toLocaleString()}<br>
                                <strong>Updated:</strong> ${new Date(conv.updated_at).toLocaleString()}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = '<div class="loading">No conversations found</div>';
            }
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        function refreshData() {
            fetchData();
        }

        // Auto-refresh every 30 seconds
        setInterval(fetchData, 30000);

        // Initial load
        fetchData();
    </script>
</body>
</html>
